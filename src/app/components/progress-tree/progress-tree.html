<svg viewBox="0 0 220 290" class="tree" role="img" [attr.aria-label]="completed.size + ' / ' + total">
  <defs>
    <radialGradient id="pt-halo">
      <stop offset="0" stop-color="#ffd99a" stop-opacity="0.7" />
      <stop offset="1" stop-color="#ffd99a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- The tree, drawn with a single hairline -->
  <path
    class="tree-line"
    d="M110 42 L58 126 L84 126 L30 196 L66 196 L12 262 L208 262 L154 196 L190 196 L136 126 L162 126 Z"
  />
  <path class="tree-line" d="M102 262 V278 M118 262 V278" />

  <!-- A faint thread through the stars, in day order -->
  <path class="thread" [attr.d]="thread" />

  <!-- One star per day -->
  @for (o of ornaments; track o.day) {
  <g class="ornament" [class.lit]="completed.has(o.day)" [attr.transform]="'translate(' + o.x + ' ' + o.y + ')'">
    @if (completed.has(o.day)) {
    <g class="spark" [style.animation-delay.ms]="300 + litIndex(o.day) * 70">
      <circle [attr.r]="o.r * 4" fill="url(#pt-halo)" class="glow" />
      <path class="flare" [attr.d]="'M0 ' + -o.r * 2.6 + ' V' + o.r * 2.6 + ' M' + -o.r * 2.6 + ' 0 H' + o.r * 2.6" />
      <circle [attr.r]="o.r" [attr.fill]="o.color" />
    </g>
    } @else {
    <circle [attr.r]="o.r * 0.8" class="unlit" />
    }
  </g>
  }

  <!-- The star on top -->
  <g class="star" [class.lit]="starLit" transform="translate(110 26)">
    <circle r="24" fill="url(#pt-halo)" [attr.opacity]="starGlow" class="star-halo" />
    <path d="M0 -14 C1.4 -3 3 -1.4 14 0 C3 1.4 1.4 3 0 14 C-1.4 3 -3 1.4 -14 0 C-3 -1.4 -1.4 -3 0 -14 Z" />
  </g>
</svg>
