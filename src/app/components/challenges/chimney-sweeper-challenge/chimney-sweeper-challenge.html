<app-game-frame
  title="challenges.chimneySweeper.title"
  instruction="challenges.chimneySweeper.instruction"
  [phase]="phase"
  [status]="status"
  [score]="score"
  [best]="bestScore"
  [isCompleted]="isCompleted"
  (restart)="restart()"
  (start)="start()"
  (reward)="completed.emit()"
>
  <div class="hud">
    <span class="lives" [attr.aria-label]="lives + ' / 3'">
      @for (h of [1, 2, 3]; track h) {
        <span [class.lost]="h > lives">❤</span>
      }
    </span>
    <span>🧱 {{ left }}</span>
    <span>⭐ {{ score }}</span>
    @if (elapsed < wideUntil) {
      <span class="wide">↔ {{ 'challenges.chimneySweeper.wide' | translate }}</span>
    }
  </div>
  <svg
    class="art board"
    viewBox="0 0 800 440"
    data-game-board
    tabindex="0"
    role="application"
    [attr.aria-label]="'challenges.chimneySweeper.title' | translate"
    (pointermove)="pointer($event)"
    (pointerdown)="press($event)"
  >
    <defs>
      <pattern id="cs-wall" width="80" height="44" patternUnits="userSpaceOnUse">
        <rect width="80" height="44" fill="#2a1a1a" />
        <path d="M0 0.5 H80 M0 22.5 H80 M40 0.5 V22.5 M0 22.5 V44 M80 22.5 V44" stroke="#150c0c" stroke-width="2" />
      </pattern>
      <radialGradient id="cs-light" cx="0.5" cy="0" r="0.9">
        <stop offset="0" stop-color="#3a4a8a" stop-opacity="0.55" />
        <stop offset="1" stop-color="#000" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="cs-snow" cx="0.35" cy="0.3" r="0.7">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="1" stop-color="#bcd4f2" />
      </radialGradient>
      <pattern id="cs-bristle" width="5" height="14" patternUnits="userSpaceOnUse">
        <path d="M2.5 0 V14" stroke="#55555f" stroke-width="1.4" />
      </pattern>
      <radialGradient id="cs-star">
        <stop offset="0" stop-color="#ffe39a" stop-opacity="0.9" />
        <stop offset="1" stop-color="#ffe39a" stop-opacity="0" />
      </radialGradient>
    </defs>

    <!-- Inside the chimney, moonlight falling from the opening above -->
    <rect width="800" height="440" fill="url(#cs-wall)" />
    <rect width="800" height="440" fill="url(#cs-light)" />
    <rect x="220" y="-1" width="360" height="30" rx="4" fill="#0b1030" />
    @for (s of stars; track $index) {
      <circle [attr.cx]="s.x" [attr.cy]="s.y" r="1.3" fill="#dfeaff" />
    }
    <circle cx="520" cy="12" r="9" fill="#fff6dc" />
    <path d="M0 0 V440 M800 0 V440" stroke="#120808" stroke-width="20" />

    <!-- Soot bricks; gold bricks hide a star -->
    @for (brick of bricks; track $index) {
      @if (brick.alive) {
        <g [attr.transform]="'translate(' + brick.x + ' ' + brick.y + ')'">
          @if (brick.gold) {
            <rect width="96" height="25" rx="5" fill="#d9a441" />
            <rect width="96" height="8" rx="4" fill="#f7d27e" />
            <path d="M48 4 L51 10 L58 10.5 L52.5 14.5 L54.5 21 L48 17 L41.5 21 L43.5 14.5 L38 10.5 L45 10 Z" fill="#fff4cf" />
          } @else {
            <rect width="96" height="25" rx="5" fill="#2b2b33" />
            @for (sp of soot; track $index) {
              <circle [attr.cx]="sp.x" [attr.cy]="sp.y" [attr.r]="sp.r" fill="#1a1a20" />
            }
            <rect x="2" y="1" width="92" height="4" rx="2" fill="#4a4a56" />
          }
        </g>
      }
    }

    <!-- Soot puffs -->
    @for (p of puffs; track p) {
      <g [attr.transform]="'translate(' + p.x + ' ' + p.y + ') scale(' + (0.6 + age(p)) + ')'" [attr.opacity]="1 - age(p)">
        <circle r="12" cx="-14" [attr.fill]="p.gold ? '#f7d27e' : '#3a3a44'" />
        <circle r="15" cy="-6" [attr.fill]="p.gold ? '#ffe39a' : '#44444f'" />
        <circle r="11" cx="15" cy="2" [attr.fill]="p.gold ? '#f7d27e' : '#3a3a44'" />
      </g>
    }

    <!-- Falling stars widen the brush -->
    @for (power of powers; track power) {
      <g [attr.transform]="'translate(' + power.x + ' ' + power.y + ')'">
        <circle r="22" fill="url(#cs-star)" />
        <path class="spin" d="M0 -12 L3.5 -4 L12 -3.5 L5.5 2 L7.5 11 L0 6 L-7.5 11 L-5.5 2 L-12 -3.5 L-3.5 -4 Z" fill="#ffd772" />
      </g>
    }

    <!-- The sweep's brush -->
    <g [attr.transform]="'translate(' + paddle + ' 0)'">
      <rect [attr.x]="-paddleWidth / 2" y="396" [attr.width]="paddleWidth" height="12" rx="6" fill="#8a5a32" />
      <rect [attr.x]="-paddleWidth / 2 + 4" y="398" [attr.width]="paddleWidth - 8" height="3" rx="1.5" fill="#b07a48" />
      <!-- Bristles -->
      <rect [attr.x]="-paddleWidth / 2 + 6" y="383" [attr.width]="paddleWidth - 12" height="14" rx="3" fill="#2a2a30" />
      <rect [attr.x]="-paddleWidth / 2 + 6" y="383" [attr.width]="paddleWidth - 12" height="14" rx="3" fill="url(#cs-bristle)" />
      <rect x="-4" y="408" width="8" height="40" fill="#6a4426" />
    </g>

    <!-- Snowball with a short trail -->
    @for (t of trail; track $index; let i = $index) {
      <circle [attr.cx]="t.x" [attr.cy]="t.y" [attr.r]="6 - i" fill="#dfeaff" [attr.opacity]="0.25 - i * 0.04" />
    }
    <circle [attr.cx]="ball.x" [attr.cy]="ball.y" r="8" fill="url(#cs-snow)" />

    @if (serving && phase === 'playing') {
      <text x="400" y="260" text-anchor="middle" class="serve">
        {{ 'challenges.chimneySweeper.serve' | translate }}
      </text>
    }
  </svg>
  <p class="help">{{ 'challenges.chimneySweeper.keys' | translate }}</p>
</app-game-frame>
