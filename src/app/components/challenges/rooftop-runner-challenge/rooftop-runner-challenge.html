<app-game-frame
  title="challenges.rooftopRunner.title"
  instruction="challenges.rooftopRunner.instruction"
  [phase]="phase"
  [status]="status"
  [score]="score"
  [best]="bestScore"
  [isCompleted]="isCompleted"
  (restart)="restart()"
  (start)="start()"
  (reward)="completed.emit()"
>
  <div class="hud">
    <span class="lives" [attr.aria-label]="lives + ' / 3'">
      @for (h of [1, 2, 3]; track h) {
        <span [class.lost]="h > lives">❤</span>
      }
    </span>
    <span>🎁 {{ collected }}/{{ goal }}</span>
    <span class="progress" aria-hidden="true"><span [style.width.%]="distance"></span></span>
  </div>
  <svg
    class="art board"
    [attr.viewBox]="viewBox"
    data-game-board
    tabindex="0"
    role="application"
    [attr.aria-label]="'challenges.rooftopRunner.title' | translate"
    (pointerdown)="$event.preventDefault(); jump()"
  >
    <defs>
      <linearGradient id="rr-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#070a1f" />
        <stop offset="1" stop-color="#1c2456" />
      </linearGradient>
      <radialGradient id="rr-moon">
        <stop offset="0.55" stop-color="#fff6dc" />
        <stop offset="1" stop-color="#fff6dc" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="rr-window" cx="0.5" cy="0.7" r="0.8">
        <stop offset="0" stop-color="#ffe2a0" />
        <stop offset="1" stop-color="#f0a849" />
      </radialGradient>
      <pattern id="rr-brick" width="14" height="10" patternUnits="userSpaceOnUse">
        <rect width="14" height="10" fill="#8f3a2c" />
        <path d="M0 0.5 H14 M0 5.5 H14 M7 0.5 V5.5 M0 5.5 V10 M14 5.5 V10" stroke="#5e2219" stroke-width="1" />
      </pattern>
      <pattern id="rr-boards" width="18" height="12" patternUnits="userSpaceOnUse">
        <path d="M0 11.5 H18" stroke="rgba(0,0,0,0.18)" stroke-width="1" />
      </pattern>
    </defs>

    <!-- Sky, moon and stars -->
    <rect width="800" height="360" fill="url(#rr-sky)" />
    @for (star of stars; track $index) {
      <circle [attr.cx]="star.x" [attr.cy]="star.y" [attr.r]="star.r" fill="#dfeaff" opacity="0.8" />
    }
    <circle [attr.cx]="viewWidth - 70" cy="62" r="46" fill="url(#rr-moon)" opacity="0.35" />
    <circle [attr.cx]="viewWidth - 70" cy="62" r="24" fill="#fff6dc" />

    <!-- Distant town, slow parallax -->
    <g [attr.transform]="'translate(' + -((camera * 0.3) % 1540) + ' 0)'" fill="#151c45">
      @for (b of skyline; track $index) {
        @for (copy of [0, 1540]; track copy) {
          <rect [attr.x]="b.x + copy" [attr.y]="300 - b.h" [attr.width]="b.w" [attr.height]="b.h + 60" />
          @if (b.roof) {
            <path [attr.d]="'M' + (b.x + copy - 4) + ' ' + (300 - b.h) + ' l' + (b.w / 2 + 4) + ' -22 l' + (b.w / 2 + 4) + ' 22 Z'" />
          }
          <rect [attr.x]="b.x + copy + 12" [attr.y]="318 - b.h" width="6" height="8" fill="#f3c46e" opacity="0.5" />
        }
      }
    </g>

    <!-- Houses -->
    @for (roof of visibleRoofs; track roof.x) {
      <g class="house" [attr.data-look]="roof.look" [attr.transform]="'translate(' + (roof.x - camera) + ',' + roof.y + ')'">
        <rect class="wall" [attr.width]="roof.width" height="170" />
        <rect [attr.width]="roof.width" height="170" fill="url(#rr-boards)" />
        <!-- Lit windows with frames and a wreath on every other house -->
        @for (wx of [0.12, 0.38, 0.64, 0.86]; track wx) {
          <g [attr.transform]="'translate(' + (roof.width * wx - 16) + ' 34)'">
            <rect x="-3" y="-3" width="38" height="44" rx="4" fill="#2a1d18" />
            <rect width="32" height="38" rx="3" fill="url(#rr-window)" />
            <path d="M16 0 V38 M0 18 H32" stroke="#2a1d18" stroke-width="3" />
            <rect x="-5" y="38" width="42" height="5" rx="2" fill="#f4f7ff" />
          </g>
        }
        @if (roof.look % 2 === 0) {
          <circle [attr.cx]="roof.width / 2" cy="102" r="11" fill="none" stroke="#2f8a5c" stroke-width="6" />
          <circle [attr.cx]="roof.width / 2" cy="92" r="3" fill="#e0475b" />
        }
        <!-- Snow on the roof edge, with icicle drips -->
        <path
          [attr.d]="'M-4 2 Q-4 -9 8 -9 H' + (roof.width - 8) + ' Q' + (roof.width + 4) + ' -9 ' + (roof.width + 4) + ' 2 Q' + (roof.width - 30) + ' 10 ' + roof.width * 0.7 + ' 6 Q' + roof.width * 0.5 + ' 12 ' + roof.width * 0.3 + ' 6 Q' + roof.width * 0.15 + ' 11 -4 2 Z'"
          fill="#f4f7ff"
        />
        @if (roof.chimney > -10000) {
          <g [attr.transform]="'translate(' + (roof.chimney - roof.x) + ' 0)'">
            <rect [attr.y]="-roof.height" width="28" [attr.height]="roof.height" fill="url(#rr-brick)" />
            <rect x="-4" [attr.y]="-roof.height - 8" width="36" height="9" rx="3" fill="#6d2a20" />
            <path [attr.d]="'M-5 ' + (-roof.height - 6) + ' Q14 ' + (-roof.height - 16) + ' 33 ' + (-roof.height - 6) + ' Z'" fill="#f4f7ff" />
            <g class="smoke" [attr.transform]="'translate(14 ' + (-roof.height - 14) + ')'">
              <circle r="6" />
              <circle r="8" cx="-4" cy="-14" />
              <circle r="10" cx="2" cy="-30" />
            </g>
          </g>
        }
      </g>
    }

    <!-- Finish: the sleigh waits on the last roof -->
    @if (finishLocal < viewWidth + 120) {
      <g [attr.transform]="'translate(' + (finishLocal - 10) + ' ' + ((roofs.at(-1)?.y ?? 280) - 4) + ')'">
        <path d="M-6 0 H70 Q84 0 84 -14" fill="none" stroke="#c9a65a" stroke-width="4" stroke-linecap="round" />
        <path d="M2 -6 H60 Q76 -6 72 -30 H48 Q40 -18 18 -22 Q4 -22 2 -6 Z" fill="#c22f45" />
        <path d="M2 -6 H60" stroke="#f7c873" stroke-width="3" />
        <rect x="22" y="-40" width="18" height="16" rx="2" fill="#3aae8a" />
        <path d="M31 -40 V-24 M22 -32 H40" stroke="#f7c873" stroke-width="3" />
        <path d="M-14 0 V-56" stroke="#dfeaff" stroke-width="2" />
        <path d="M-14 -56 H6 L0 -48 H6 L-14 -40 Z" fill="#e0475b" />
      </g>
    }

    <!-- Presents -->
    @for (gift of visibleGifts; track gift) {
      <g class="gift" [attr.transform]="'translate(' + (gift.x - camera) + ',' + gift.y + ')'">
        <rect x="-11" y="-9" width="22" height="19" rx="3" [attr.fill]="gift.x % 3 < 1 ? '#3aae8a' : gift.x % 3 < 2 ? '#e0475b' : '#7fb8ff'" />
        <rect x="-13" y="-12" width="26" height="6" rx="2" [attr.fill]="gift.x % 3 < 1 ? '#2c8c6e' : gift.x % 3 < 2 ? '#b72e45' : '#5c8fd6'" />
        <path d="M0 -12 V10" stroke="#f7c873" stroke-width="4" />
        <path d="M0 -12 C-8 -22 -13 -12 0 -12 C8 -22 13 -12 0 -12" fill="none" stroke="#f7c873" stroke-width="3" />
      </g>
    }

    <!-- Santa -->
    <g
      [attr.transform]="'translate(' + (x - camera) + ',' + y + ')'"
      [attr.opacity]="invulnerable > 0 ? 0.5 : 1"
    >
      <!-- Sack -->
      <path d="M-4 16 Q-14 18 -12 30 Q-10 38 2 36 Z" fill="#8a6440" />
      <!-- Legs and boots -->
      <path [attr.d]="'M8 32 L' + (6 + stride) + ' 40'" stroke="#b72e45" stroke-width="7" stroke-linecap="round" />
      <path [attr.d]="'M17 32 L' + (19 - stride) + ' 40'" stroke="#b72e45" stroke-width="7" stroke-linecap="round" />
      <rect [attr.x]="2 + stride" y="38" width="10" height="5" rx="2" fill="#1a1414" />
      <rect [attr.x]="15 - stride" y="38" width="10" height="5" rx="2" fill="#1a1414" />
      <!-- Coat -->
      <rect x="2" y="15" width="22" height="20" rx="7" fill="#e0475b" />
      <rect x="2" y="25" width="22" height="4" fill="#1a1414" />
      <rect x="10" y="24" width="6" height="6" rx="1" fill="#f7c873" />
      <path d="M13 15 V35" stroke="#f4f7ff" stroke-width="3" />
      <!-- Face, beard and hat -->
      <circle cx="14" cy="9" r="7" fill="#f2c7a5" />
      <path d="M6 9 Q6 22 14 22 Q22 22 22 9 Q18 14 14 13 Q10 14 6 9 Z" fill="#f4f7ff" />
      <circle cx="17" cy="7" r="1.2" fill="#1a1414" />
      <path d="M5 4 Q8 -10 22 -6 L20 3 Z" fill="#e0475b" />
      <rect x="4" y="1" width="19" height="5" rx="2.5" fill="#f4f7ff" />
      <circle cx="23" cy="-6" r="3.5" fill="#f4f7ff" />
    </g>
  </svg>
  <button
    class="btn btn-secondary jump"
    [disabled]="phase === 'won' || phase === 'lost'"
    (pointerdown)="$event.preventDefault(); jump()"
    (keydown.enter)="jump()"
    (keydown.space)="$event.preventDefault(); jump()"
  >
    ↑ {{ 'challenges.rooftopRunner.jump' | translate }}
  </button>
</app-game-frame>
